# Warm "spice" theme for the Kusha Costing App.
# Picked up automatically when running `streamlit run app.py` from the repo.
# The packaged desktop app sets the same values via environment variables in
# run_app.py (so the theme applies regardless of the working directory).
[theme]
base = "light"
primaryColor = "#009B77"            # Kusha Aquamarine — buttons, highlights
backgroundColor = "#FFFFFF"         # Kusha White page
secondaryBackgroundColor = "#F0F5F3" # light aquamarine tint — cards, sidebar, tables
textColor = "#3D4A41"               # Kusha Royal Green — text
font = "sans serif"

[client]
toolbarMode = "minimal"

[server]
headless = true
