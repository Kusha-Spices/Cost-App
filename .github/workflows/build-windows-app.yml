name: Build Windows app

# Builds a self-contained Windows app (KushaCostingApp.exe) on a real Windows
# machine. The end user needs nothing installed — just download, unzip and run
# KushaCostingApp.exe.
#
# Trigger it from the GitHub "Actions" tab (Run workflow). Optionally give a
# "release_tag" (e.g. v9.1) and the built app is published to a GitHub Release
# under that tag. Pushing a v* tag does the same.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a Release under this tag (e.g. v9.1). Leave blank to only upload artifacts."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build the .exe
        run: pyinstaller --noconfirm --clean KushaCostingApp.spec

      - name: Verify the native-window backend is bundled
        run: |
          # Import the native window backend (pywebview + pythonnet/clr) from
          # inside the built app. The app is a GUI-subsystem exe, so PowerShell's
          # '&' does NOT wait for it and would not capture the exit code — use
          # Start-Process -Wait -PassThru to actually wait and read .ExitCode.
          $p = Start-Process -FilePath "dist\KushaCostingApp\KushaCostingApp.exe" -ArgumentList "--self-test" -Wait -PassThru
          Write-Host "----- launch.log -----"
          Get-Content "$env:APPDATA\Kusha Costing App\launch.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "native-backend self-test failed (exit $($p.ExitCode))" }
          Write-Host "native backend import: OK"

      - name: Smoke-test the built app (windowed launch, like a double-click)
        run: |
          Start-Process -FilePath "dist\KushaCostingApp\KushaCostingApp.exe"
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing "http://localhost:8501/" -TimeoutSec 2
              if ($r.StatusCode -eq 200) { Write-Host "App served HTTP 200"; $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          Write-Host "----- launch.log (diagnostic) -----"
          Get-Content "$env:APPDATA\Kusha Costing App\launch.log" -ErrorAction SilentlyContinue
          Stop-Process -Name KushaCostingApp -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "app did not serve in time" }

      - name: Zip the app
        run: Compress-Archive -Path "dist\KushaCostingApp" -DestinationPath "Kusha-Costing-App-windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kusha-Costing-App-windows
          path: Kusha-Costing-App-windows.zip
          if-no-files-found: error

      - name: Publish this build to the Release
        if: ${{ github.event.inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Kusha Costing App ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            Self-contained Kusha Costing App — nothing to install.

            **Windows:** download `Kusha-Costing-App-windows.zip`, unzip it, open the
            `KushaCostingApp` folder and run **KushaCostingApp.exe**. If SmartScreen
            warns, click *More info → Run anyway* (unsigned internal app).

            **macOS:** download the build for your Mac, unzip, drag **Kusha Costing App.app**
            to Applications, then right-click → Open the first time.

            - **Windows**: `Kusha-Costing-App-windows.zip`
            - **macOS Apple Silicon** (M1/M2/M3/M4): `Kusha-Costing-App-apple-silicon.zip`
            - **macOS Intel**: `Kusha-Costing-App-intel.zip`
          files: Kusha-Costing-App-windows.zip
          fail_on_unmatched_files: true
