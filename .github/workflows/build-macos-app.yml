name: Build macOS app

# Builds a self-contained "Kusha Costing App.app" on real macOS machines.
# The end user needs nothing installed — just download, unzip and double-click.
#
# Trigger it from the GitHub "Actions" tab (Run workflow). Optionally give a
# "release_tag" (e.g. v9.0) and each built app is published to a GitHub Release
# under that tag as soon as it is ready. Pushing a v* tag does the same.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a Release under this tag (e.g. v9.0). Leave blank to only upload artifacts."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # Apple Silicon (M1/M2/M3/M4)
            arch: apple-silicon
          - runner: macos-13   # Intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build the .app
        run: pyinstaller --noconfirm --clean KushaCostingApp.spec

      - name: Ad-hoc code-sign the app
        # No paid Apple Developer cert, so sign ad-hoc. This prevents the hard
        # "app is damaged" block and gives users the normal right-click → Open path.
        run: |
          codesign --force --deep --sign - "dist/Kusha Costing App.app"
          codesign --verify --deep --strict --verbose=2 "dist/Kusha Costing App.app" || true

      - name: Verify the native-window backend is bundled
        run: |
          # Import the native window backend from inside the built app. Running
          # from a shell gives real stdout, so we read the result directly. Fails
          # the build if pywebview/pyobjc were not packaged correctly.
          "dist/Kusha Costing App.app/Contents/MacOS/KushaCostingApp" --self-test

      - name: Smoke-test the built app (windowed launch, like a double-click)
        run: |
          # Launch via `open` to reproduce the real Finder double-click path.
          open "dist/Kusha Costing App.app"
          OK=""
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w '%{http_code}' http://localhost:8501/ | grep -q 200; then
              echo "App served HTTP 200"; OK=1; break
            fi
            sleep 1
          done
          echo "----- launch.log (diagnostic) -----"
          cat "$HOME/Library/Application Support/Kusha Costing App/launch.log" 2>/dev/null || echo "(no log)"
          pkill -f KushaCostingApp 2>/dev/null || true
          test "$OK" = "1"

      - name: Zip the .app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Kusha Costing App.app" "../Kusha-Costing-App-${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kusha-Costing-App-${{ matrix.arch }}
          path: Kusha-Costing-App-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Publish this build to the Release
        # Each architecture publishes independently, so the Apple Silicon app
        # appears immediately without waiting on the (often slow) Intel runner.
        if: ${{ github.event.inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Kusha Costing App ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            Self-contained macOS app — nothing to install.

            Download the build for your Mac, unzip, drag **Kusha Costing App.app**
            to Applications, then right-click → Open the first time.

            - **Apple Silicon** (M1/M2/M3/M4): `Kusha-Costing-App-apple-silicon.zip`
            - **Intel**: `Kusha-Costing-App-intel.zip`
          files: Kusha-Costing-App-${{ matrix.arch }}.zip
          fail_on_unmatched_files: true
